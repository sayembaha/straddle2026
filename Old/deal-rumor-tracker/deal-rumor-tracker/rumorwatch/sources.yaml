# Add/remove sources freely. Tags affect scoring (trade/local/niche => small boost; wire => slight penalty).
# Types: rss, web, greenhouse (org slug), lever (org slug)

sources:
  # --- Trade & M&A-focused media (RSS preferred) ---
  - type: rss
    site: "PE Hub"
    url: "https://www.pehub.com/feed/"
    tags: ["trade", "niche"]

  - type: rss
    site: "Mergers & Acquisitions (The Middle Market)"
    url: "https://www.themiddlemarket.com/.rss/full/"
    tags: ["trade", "niche"]

  - type: rss
    site: "DealStreetAsia"
    url: "https://www.dealstreetasia.com/feed/"
    tags: ["trade", "regional"]

  - type: rss
    site: "Global Legal Chronicle"
    url: "https://globallegalchronicle.com/feed/"
    tags: ["trade", "legal"]

  # --- Local business press ---
  - type: rss
    site: "Dallas Business Journal"
    url: "https://www.bizjournals.com/dallas/rss"
    tags: ["local"]

  - type: rss
    site: "Silicon Valley Business Journal"
    url: "https://www.bizjournals.com/sanjose/rss"
    tags: ["local"]

  # --- Company newsroom example (RSS) ---
  - type: rss
    site: "Business Wire M&A (global)"
    url: "https://www.businesswire.com/portal/site/home/news/subject/?vnsId=31386&rss=1"
    tags: ["wire"]

  # --- Web pages (fallback when RSS is unavailable) ---
  - type: web
    site: "Skadden Insights (example list page)"
    url: "https://www.skadden.com/insights"
    tags: ["trade", "legal"]

  # --- Job boards (law firms / corp dev) ---
  # Greenhouse org slugs (examples; replace with actual firms you care about)
  - type: greenhouse
    org: "evercore"
    tags: ["jobs", "niche"]

  - type: greenhouse
    org: "moelisandcompany"
    tags: ["jobs", "niche"]

  # Lever org slugs (examples)
  - type: lever
    org: "ramp"
    tags: ["jobs"]

  - type: lever
    org: "databricks"
    tags: ["jobs"]
