services:
  - type: web
    name: straddle-api
    env: docker
    plan: free
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: STRADDLE_UA
        value: Straddle/0.1 (+youremail@example.com)
      - key: SAVE_TARGET
        value: notion
      # Add NOTION_* or AIRTABLE_* in the dashboard
    healthCheckPath: /docs
  - type: web
    name: straddle-web
    env: docker
    plan: free
    dockerfilePath: Dockerfile.frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
