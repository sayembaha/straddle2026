app = "straddle-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  STRADDLE_UA = "Straddle/0.1 (+youremail@example.com)"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 50
    soft_limit = 20
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
