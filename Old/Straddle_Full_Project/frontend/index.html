<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Straddle — Web (Integrated)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(180deg,#fff,#f8fbff);border-bottom:1px solid #e5e7eb}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;font-weight:900}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:#fff;border-right:1px solid #e5e7eb;padding:12px}
.main{padding:16px}
h3{margin:10px 0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 30px rgba(2,6,23,.06);padding:14px;margin:10px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid #e5e7eb;background:#fff;padding:10px 12px;border-radius:12px;cursor:pointer}
.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.table{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid #e5e7eb;text-align:left}
th{background:#f9fbff}
input,textarea{border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{font-size:12px;color:#475569}
</style>
</head>
<body>
<div class="top"><div class="logo">S</div><b>Straddle</b><span class="small">integrated demo</span></div>
<div class="wrap">
  <div class="sidebar">
    <h3>Agents</h3>
    <div class="controls">
      <button class="btn" onclick="demoRumors()">Rumor Tracker</button>
      <button class="btn" onclick="demoDeals()">M&A Deals</button>
      <button class="btn" onclick="demoCommentary()">Commentary Δ</button>
      <button class="btn" onclick="demoFilings()">SEC Δ</button>
      <button class="btn" onclick="demoDebt()">Debt Heatmap</button>
    </div>
    <div class="card">
      <h3>Backend</h3>
      <div class="small">Run API: <code>uvicorn app:app --reload</code><br/>Set API URL with:<br/><code>localStorage.setItem('STRADDLE_API','http://127.0.0.1:8000')</code></div>
    </div>
    <div class="card">
      <h3>Save</h3>
      <div class="controls">
        <button class="btn" onclick="saveLast('rumor')">Save Rumors</button>
        <button class="btn" onclick="saveLast('deal')">Save Deals</button>
      </div>
      <div class="small">Requires SAVE_TARGET + provider env vars on API.</div>
    </div>
  </div>
  <div class="main">
    <div class="card"><h3>Ask</h3>
      <div class="row">
        <div>
          <label class="small">Ticker / Company</label>
          <input id="ticker" placeholder="TNVA"/>
        </div>
        <div>
          <label class="small">Sector / Keywords</label>
          <input id="keywords" placeholder="AI infrastructure"/>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <div>
          <label class="small">Prior Doc URL</label>
          <input id="prior" placeholder="https://example.com/prev.pdf"/>
        </div>
        <div>
          <label class="small">Current Doc URL</label>
          <input id="current" placeholder="https://example.com/current.pdf"/>
        </div>
      </div>
      <div class="controls"><button class="btn primary" onclick="runAll()">Run All</button></div>
    </div>
    <div id="out"></div>
  </div>
</div>
<script>
const API_BASE = localStorage.getItem('STRADDLE_API') || 'http://localhost:8000';
let LAST_RUMORS = [], LAST_DEALS = [];

function setOutput(html){ document.getElementById('out').innerHTML = html; }
function append(html){ document.getElementById('out').insertAdjacentHTML('beforeend', html); }

async function demoRumors(){
  const kw = document.getElementById('keywords').value || 'M&A, acquisition';
  const url = API_BASE + '/api/rumors?timeframe=30&keywords=' + encodeURIComponent(kw);
  const r = await fetch(url); const data = await r.json();
  LAST_RUMORS = data;
  const rows = data.map(x => `<tr><td>${x.published}</td><td>${x.title}</td><td>${x.confidence}</td><td><a href="${x.link}" target="_blank">open</a></td></tr>`).join('');
  append(`<div class="card"><h3>Rumor Digest</h3><div class="table"><table><thead><tr><th>Published</th><th>Title</th><th>Confidence</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table></div></div>`);
}

async function demoDeals(){
  const kw = document.getElementById('keywords').value || '';
  const url = API_BASE + '/api/deals?timeframe=60&sector=' + encodeURIComponent(kw);
  const r = await fetch(url); const data = await r.json();
  LAST_DEALS = data.items || [];
  const rows = LAST_DEALS.map(x => `<tr><td>${x.published||''}</td><td>${x.title||''}</td><td>${x.value||''}</td><td>${x.rationale||''}</td><td><a href="${x.link}" target="_blank">open</a></td></tr>`).join('');
  append(`<div class="card"><h3>M&A Deal Cards</h3><div class="table"><table><thead><tr><th>Date</th><th>Title</th><th>Value</th><th>Rationale</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table></div></div>`);
}

async function demoCommentary(){
  const prior = document.getElementById('prior').value;
  const current = document.getElementById('current').value;
  if(!prior || !current){ alert('Provide both Prior and Current doc URLs'); return; }
  const url = API_BASE + '/api/commentary?prior_url=' + encodeURIComponent(prior) + '&current_url=' + encodeURIComponent(current);
  const r = await fetch(url); const data = await r.json();
  const a = (data.diffs?.added || []).slice(0,10).join(', ');
  const rm = (data.diffs?.removed || []).slice(0,10).join(', ');
  const rw = (data.diffs?.reworded || []).slice(0,10).join(', ');
  append(`<div class="card"><h3>Commentary Δ (Tone: ${data.tone})</h3>
    <div class="row"><div><b>Added</b><br/><div class="small">${a}</div></div>
    <div><b>Removed</b><br/><div class="small">${rm}</div></div></div>
    <div style="margin-top:8px"><b>Reworded</b><br/><div class="small">${rw}</div></div>
  </div>`);
}

async function demoFilings(){
  const t = document.getElementById('ticker').value || 'TNVA';
  const url = API_BASE + '/api/filings?ticker=' + encodeURIComponent(t) + '&filing=10-Q';
  const r = await fetch(url); const data = await r.json();
  append(`<div class="card"><h3>SEC Δ (10-Q)</h3>
    <div class="row">
      <div><b>Risk Factors</b><br/><div class="small">+${data["Risk Factors"]?.added_tokens||0} / -${data["Risk Factors"]?.removed_tokens||0}</div></div>
      <div><b>MD&A</b><br/><div class="small">+${data["MD&A"]?.added_tokens||0} / -${data["MD&A"]?.removed_tokens||0}</div></div>
    </div>
  </div>`);
}

async function demoDebt(){
  const t = document.getElementById('ticker').value || 'TNVA';
  const url = API_BASE + '/api/debt?ticker=' + encodeURIComponent(t) + '&filing=10-K';
  const r = await fetch(url); const data = await r.json();
  const rows = (data.heatmap || []).map(x => `<tr><td>${x.bucket}</td><td>${x.total}</td></tr>`).join('');
  append(`<div class="card"><h3>Debt Maturity Heatmap</h3>
    <div class="table"><table><thead><tr><th>Bucket</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`);
}

async function saveLast(channel){
  const map = {rumor: LAST_RUMORS, deal: LAST_DEALS};
  const items = map[channel] || [];
  if(!items.length){ alert('Run the agent first'); return; }
  const r = await fetch(API_BASE + '/api/save/bulk?channel=' + channel, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(items)});
  const data = await r.json();
  alert('Saved: ' + (data.count || 0));
}

async function runAll(){
  document.getElementById('out').innerHTML = '';
  await demoRumors(); await demoDeals(); await demoFilings();
}
</script>
</body>
</html>
